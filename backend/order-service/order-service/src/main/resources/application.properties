spring.application.name=order-service
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/cloudcart_orders
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.cart-service.url=http://localhost:8082

# Payment Service
app.payment-service.url=http://localhost:8086
app.payment-service.internal-secret=${PAYMENT_INTERNAL_SECRET}