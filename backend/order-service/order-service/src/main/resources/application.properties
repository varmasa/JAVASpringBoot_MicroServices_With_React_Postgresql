spring.application.name=order-service
server.port=8084

spring.datasource.url=jdbc:postgresql://database-1.c1cqwa8isnnr.ap-south-1.rds.amazonaws.com:5432/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# AWS ECS / ALB health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

spring.jpa.properties.hibernate.default_schema=order_schema
app.jwt.secret=${JWT_SECRET}
app.cart-service.url=${CART_SERVICE_URL:http://localhost:8082}
app.payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8086}
app.payment-service.internal-secret=${PAYMENT_INTERNAL_SECRET}
