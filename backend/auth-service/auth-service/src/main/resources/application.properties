spring.application.name=auth-service
server.port=8083

spring.datasource.url=jdbc:postgresql://database-1.c1cqwa8isnnr.ap-south-1.rds.amazonaws.com:5432/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

logging.level.org.springframework.security=INFO
# Use a long, random Base64-encoded secret.
# Set JWT_SECRET in your local environment.

spring.jpa.properties.hibernate.default_schema=auth_schema
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
