# Application
spring.application.name=payment-service
server.port=8086

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://database-1.c1cqwa8isnnr.ap-south-1.rds.amazonaws.com:5432/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.default_schema=payment_schema

# Razorpay Test Credentials
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# Frontend
app.frontend-url=${FRONTEND_URL:https://thepetclinic.xyz}

# Internal service authentication
app.internal-service-secret=${PAYMENT_INTERNAL_SECRET}
