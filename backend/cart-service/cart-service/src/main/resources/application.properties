spring.application.name=cart-service
server.port=8082

spring.datasource.url=jdbc:postgresql://database-1.c1cqwa8isnnr.ap-south-1.rds.amazonaws.com:5432/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.default_schema=cart_schema
app.jwt.secret=${JWT_SECRET}
app.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8081}
